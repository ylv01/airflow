# SPDX-License-Identifier: Apache-2.0
name: Test Stackdriver list formats
on:
  push:
    branches: [verify/cloud-monitoring-rebase]
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANSWER: "yes"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install development tools
        run: |
          uv tool install prek
          ./scripts/tools/setup_breeze
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pull upstream Breeze image
        id: image
        run: breeze ci-image pull --python 3.10 --github-repository apache/airflow
      - name: Operator and hook unit tests
        if: always() && steps.image.outcome == 'success'
        run: breeze run --python 3.10 --github-repository apache/airflow --skip-image-upgrade-check pytest providers/google/tests/unit/google/cloud/operators/test_cloud_monitoring.py providers/google/tests/unit/google/cloud/hooks/test_cloud_monitoring.py providers/google/tests/unit/google/cloud/operators/test_stackdriver.py providers/google/tests/unit/google/cloud/hooks/test_stackdriver.py -q
      - name: Prove new tests fail without the fix
        if: always() && steps.image.outcome == 'success'
        run: |
          source=providers/google/src/airflow/providers/google/cloud/operators/cloud_monitoring.py
          trap 'git restore "$source"' EXIT
          git show b1c534f:"$source" > "$source"
          set +e
          breeze run --python 3.10 --github-repository apache/airflow --skip-image-upgrade-check pytest providers/google/tests/unit/google/cloud/operators/test_cloud_monitoring.py -k preserves_formatted_result --tb=short -q 2>&1 | tee regression.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -q "4 failed" regression.log

